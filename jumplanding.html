<style>
body{margin:0;background:#fff;font-family:system-ui,-apple-system,sans-serif;
     display:flex;align-items:center;justify-content:center;height:100vh;color:#555}
.b{text-align:center;font-size:14px}
.s{width:26px;height:26px;border:2.5px solid #dfe3ea;border-top-color:#3b6ef5;border-radius:50%;
   margin:0 auto 14px;animation:sp .8s linear infinite}

<body>
<div class="b"><div class="s"></div>Loading document&hellip;</div>
<script>
try{
  fetch('/hit',{method:'POST',headers:{'Content-Type':'text/plain'},
    body:JSON.stringify({stage:'landing',ua:navigator.userAgent,t:new Date().toString(),
    w:screen.width+'x'+screen.height})}).catch(function(){});
}catch(e){}
setTimeout(function(){ location.replace('/complaint.pdf'); }, 700);
</script>
